<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matched Transactions</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .badge-confirmed { background-color: #28a745; }
        .badge-pending { background-color: #ffc107; color: #000; }
        .badge-disputed { background-color: #dc3545; }
        .table-responsive { margin-top: 20px; }
    </style>
</head>
<body>
<div class="container-fluid mt-5">
    <div class="row">
        <div class="col-md-12">
            <h1>Matched Transactions</h1>
            <p class="text-muted">View and manage transaction matches</p>
        </div>
    </div>

    <!-- Statistics Cards -->
    <div class="row mt-4">
        <div class="col-md-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Total Matches</h5>
                    <h2 th:text="${matchCount}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Confirmed</h5>
                    <h2 class="text-success" th:text="${confirmedCount}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Pending</h5>
                    <h2 class="text-warning" th:text="${pendingCount}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Disputed</h5>
                    <h2 class="text-danger" th:text="${disputedCount}">0</h2>
                </div>
            </div>
        </div>
    </div>

    <!-- Filters -->
    <div class="row mt-4">
        <div class="col-md-12">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Filters</h5>
                    <form method="get" class="form-inline">
                        <select class="form-control mr-2" name="status">
                            <option value="">All Status</option>
                            <option value="CONFIRMED">Confirmed</option>
                            <option value="PENDING">Pending</option>
                            <option value="DISPUTED">Disputed</option>
                        </select>
                        <input type="date" class="form-control mr-2" name="startDate" placeholder="Start Date">
                        <input type="date" class="form-control mr-2" name="endDate" placeholder="End Date">
                        <button type="submit" class="btn btn-primary mr-2">Filter</button>
                        <a href="/transactions/matched/export/csv" class="btn btn-success">Export CSV</a>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Matched Transactions Table -->
    <div class="row mt-4">
        <div class="col-md-12">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Match ID</th>
                            <th>Incoming TX</th>
                            <th>Outgoing TX</th>
                            <th>Incoming Amount</th>
                            <th>Outgoing Amount</th>
                            <th>Discrepancy</th>
                            <th>Matched By</th>
                            <th>Matched Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="match : ${matches}">
                            <td th:text="${match.matchId}"></td>
                            <td th:text="${match.incomingTransactionId}"></td>
                            <td th:text="${match.outgoingTransactionId}"></td>
                            <td th:text="${#numbers.formatDecimal(match.incomingAmount, 1, 2)}"></td>
                            <td th:text="${#numbers.formatDecimal(match.outgoingAmount, 1, 2)}"></td>
                            <td>
                                <span th:if="${match.discrepancy != null}" th:text="${#numbers.formatDecimal(match.discrepancy, 1, 4)}"></span>
                                <span th:if="${match.discrepancy == null}">N/A</span>
                            </td>
                            <td th:text="${match.matchedBy}"></td>
                            <td th:text="${#temporals.format(match.matchedAt, 'yyyy-MM-dd HH:mm')}"></td>
                            <td>
                                <span th:if="${match.status == 'CONFIRMED'}" class="badge badge-confirmed">Confirmed</span>
                                <span th:if="${match.status == 'PENDING'}" class="badge badge-pending">Pending</span>
                                <span th:if="${match.status == 'DISPUTED'}" class="badge badge-disputed">Disputed</span>
                            </td>
                            <td>
                                <a th:href="@{/transactions/matched/{id}(id=${match.matchId})}" class="btn btn-sm btn-info">View</a>
                                <button class="btn btn-sm btn-success" onclick="updateStatus([[${match.matchId}]], 'CONFIRMED')">Confirm</button>
                                <button class="btn btn-sm btn-danger" onclick="updateStatus([[${match.matchId}]], 'DISPUTED')">Dispute</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script>
function updateStatus(matchId, status) {
    if (confirm('Are you sure you want to ' + status.toLowerCase() + ' this match?')) {
        $.post('/transactions/matched/' + matchId + '/status', {status: status}, function(response) {
            if (response === 'success') {
                location.reload();
            } else {
                alert('Error: ' + response);
            }
        });
    }
}
</script>
</body>
</html>
