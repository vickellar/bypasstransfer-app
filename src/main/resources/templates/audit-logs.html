<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs — ByPass Transfers</title>
    <link rel="stylesheet" th:href="@{/css/site.css}"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%); color: #e2e8f0; }
        .page-wrapper { max-width: 1400px; margin: 0 auto; padding: 32px 24px; }

        .page-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 32px; gap: 16px; flex-wrap: wrap;
        }
        .page-header-left h1 {
            font-size: 26px; font-weight: 800; color: #f1f5f9;
            display: flex; align-items: center; gap: 12px;
        }
        .page-header-left h1 i { color: #3b82f6; }
        .page-header-left p { color: #94a3b8; font-size: 14px; margin-top: 4px; }
        .btn-back {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
            color: #cbd5e1; padding: 10px 18px; border-radius: 8px; text-decoration: none;
            font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px;
            transition: background 0.2s;
        }
        .btn-back:hover { background: rgba(255,255,255,0.14); color: #f1f5f9; }

        .glass {
            background: rgba(255,255,255,0.07); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 28px;
            margin-bottom: 28px;
        }
        .card-title {
            font-size: 16px; font-weight: 700; color: #f1f5f9;
            margin-bottom: 20px; display: flex; align-items: center; gap: 8px;
        }
        .card-title i { color: #3b82f6; }

        /* Filter bar */
        .filter-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: flex-end; }
        .filter-bar input, .filter-bar select {
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px; color: #f1f5f9; padding: 10px 14px; font-size: 14px;
            outline: none; min-width: 160px;
        }
        .filter-bar input:focus, .filter-bar select:focus { border-color: #3b82f6; }
        .filter-bar select option { background: #1e293b; }

        .btn-export {
            background: linear-gradient(135deg, #22c55e, #16a34a); color: white;
            border: none; padding: 10px 20px; border-radius: 8px; font-size: 13px;
            font-weight: 600; cursor: pointer; display: inline-flex; align-items: center;
            gap: 6px; transition: opacity 0.2s; text-decoration: none;
        }
        .btn-export:hover { opacity: 0.88; }

        /* Stat chips */
        .stat-chips { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
        .chip {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
            border-radius: 24px; padding: 6px 16px; font-size: 13px; color: #cbd5e1;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .chip span { font-weight: 700; color: #f1f5f9; }

        /* Table */
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: rgba(255,255,255,0.06); color: #94a3b8; font-weight: 600;
             text-transform: uppercase; letter-spacing: 0.04em; font-size: 11px;
             padding: 12px 14px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.08); }
        td { padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #cbd5e1; vertical-align: top; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.03); }

        .badge {
            display: inline-block; padding: 3px 10px; border-radius: 20px;
            font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
        }
        .badge-create { background: rgba(34,197,94,0.2); color: #86efac; border: 1px solid rgba(34,197,94,0.25); }
        .badge-update { background: rgba(59,130,246,0.2); color: #93c5fd; border: 1px solid rgba(59,130,246,0.25); }
        .badge-delete { background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.25); }
        .badge-login  { background: rgba(245,158,11,0.2); color: #fcd34d; border: 1px solid rgba(245,158,11,0.3); }

        .empty-state { text-align: center; padding: 40px; color: #64748b; }
        .empty-state i { font-size: 40px; margin-bottom: 12px; display: block; }

        .old-new-cell { max-width: 200px; word-break: break-word; font-size: 12px; font-family: monospace; color: #94a3b8; }

        /* Pagination */
        .pagination { display: flex; gap: 6px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        .pagination button, .pagination span {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
            color: #cbd5e1; padding: 6px 14px; border-radius: 6px; font-size: 13px;
            cursor: pointer; transition: background 0.15s;
        }
        .pagination button:hover { background: rgba(255,255,255,0.14); }
        .pagination .active { background: #3b82f6; color: white; border-color: #3b82f6; }
    </style>
</head>
<body>
<div th:insert="~{fragments/header :: header}"></div>

<div class="page-wrapper">

    <!-- Header -->
    <div class="page-header">
        <div class="page-header-left">
            <h1><i class="fas fa-clipboard-list"></i> Audit Logs</h1>
            <p>Complete audit trail of all system actions and changes</p>
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn-export" onclick="exportCSV()"><i class="fas fa-download"></i> Export CSV</button>
            <a th:href="@{/admin}" class="btn-back"><i class="fas fa-arrow-left"></i> Admin Console</a>
        </div>
    </div>

    <!-- Stats -->
    <div class="stat-chips">
        <div class="chip"><i class="fas fa-list" style="color:#3b82f6;"></i> Total Entries: <span th:text="${#lists.size(logs)}">0</span></div>
    </div>

    <!-- Filters -->
    <div class="glass">
        <div class="card-title"><i class="fas fa-filter"></i> Filter &amp; Search</div>
        <div class="filter-bar">
            <input type="text" id="searchInput" placeholder="Search by entity, action, user…" onkeyup="applyFilters()"/>
            <select id="actionFilter" onchange="applyFilters()">
                <option value="">All Actions</option>
                <option value="CREATE">CREATE</option>
                <option value="UPDATE">UPDATE</option>
                <option value="DELETE">DELETE</option>
                <option value="LOGIN">LOGIN</option>
            </select>
            <select id="entityFilter" onchange="applyFilters()">
                <option value="">All Entities</option>
            </select>
        </div>
    </div>

    <!-- Table -->
    <div class="glass">
        <div class="card-title"><i class="fas fa-table"></i> Log Entries</div>

        <div th:if="${#lists.isEmpty(logs)}" class="empty-state">
            <i class="fas fa-clipboard-check" style="color:#22c55e;"></i>
            <p>No audit log entries found.</p>
        </div>

        <div th:if="${!#lists.isEmpty(logs)}">
            <div class="table-wrap">
                <table id="auditTable">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Entity</th>
                        <th>Entity ID</th>
                        <th>Action</th>
                        <th>Old Value</th>
                        <th>New Value</th>
                        <th>Performed By</th>
                        <th>When</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="log : ${logs}" class="audit-row">
                        <td th:text="${log.id}"></td>
                        <td th:text="${log.entityName}" class="entity-cell"></td>
                        <td th:text="${log.entityId}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${log.action != null && log.action.toUpperCase().contains('CREATE') ? 'badge-create' :
                                      (log.action != null && log.action.toUpperCase().contains('UPDATE') ? 'badge-update' :
                                      (log.action != null && log.action.toUpperCase().contains('DELETE') ? 'badge-delete' :
                                      (log.action != null && log.action.toUpperCase().contains('LOGIN') ? 'badge-login' : 'badge-update')))}"
                                  th:text="${log.action}"></span>
                        </td>
                        <td class="old-new-cell" th:text="${log.oldValue}"></td>
                        <td class="old-new-cell" th:text="${log.newValue}"></td>
                        <td th:text="${log.performedBy}"></td>
                        <td th:text="${log.performedAt != null ? #temporals.format(log.performedAt, 'yyyy-MM-dd HH:mm:ss') : '—'}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

</div>

<div th:insert="~{fragments/footer :: footer}"></div>

<script>
    var PAGE_SIZE = 25;
    var currentPage = 1;
    var allRows = [];
    var filteredRows = [];

    document.addEventListener('DOMContentLoaded', function() {
        allRows = Array.from(document.querySelectorAll('#auditTable tbody .audit-row'));
        // Populate entity filter
        var entities = new Set();
        allRows.forEach(function(row) {
            var entity = row.querySelector('.entity-cell');
            if (entity && entity.textContent.trim()) entities.add(entity.textContent.trim());
        });
        var entitySelect = document.getElementById('entityFilter');
        entities.forEach(function(e) {
            var opt = document.createElement('option');
            opt.value = e; opt.textContent = e;
            entitySelect.appendChild(opt);
        });
        applyFilters();
    });

    function applyFilters() {
        var q = document.getElementById('searchInput').value.toLowerCase();
        var actionVal = document.getElementById('actionFilter').value.toLowerCase();
        var entityVal = document.getElementById('entityFilter').value.toLowerCase();

        filteredRows = allRows.filter(function(row) {
            var text = row.textContent.toLowerCase();
            var matchSearch = !q || text.includes(q);
            var matchAction = !actionVal || text.includes(actionVal);
            var entityCell = row.querySelector('.entity-cell');
            var matchEntity = !entityVal || (entityCell && entityCell.textContent.trim().toLowerCase() === entityVal);
            return matchSearch && matchAction && matchEntity;
        });

        currentPage = 1;
        renderPage();
    }

    function renderPage() {
        // Hide all
        allRows.forEach(function(r) { r.style.display = 'none'; });

        var totalPages = Math.max(1, Math.ceil(filteredRows.length / PAGE_SIZE));
        var start = (currentPage - 1) * PAGE_SIZE;
        var end = Math.min(start + PAGE_SIZE, filteredRows.length);

        for (var i = start; i < end; i++) {
            filteredRows[i].style.display = '';
        }

        // Pagination controls
        var pag = document.getElementById('pagination');
        pag.innerHTML = '';
        if (totalPages <= 1) return;

        for (var p = 1; p <= totalPages; p++) {
            var btn = document.createElement('button');
            btn.textContent = p;
            btn.dataset.page = p;
            if (p === currentPage) btn.className = 'active';
            btn.onclick = function() {
                currentPage = parseInt(this.dataset.page);
                renderPage();
            };
            pag.appendChild(btn);
        }
    }

    function exportCSV() {
        var rows = filteredRows.length > 0 ? filteredRows : allRows;
        var csv = 'ID,Entity,Entity ID,Action,Old Value,New Value,Performed By,When\n';
        rows.forEach(function(row) {
            var cells = row.querySelectorAll('td');
            var line = [];
            cells.forEach(function(cell) {
                var val = cell.textContent.trim().replace(/"/g, '""');
                line.push('"' + val + '"');
            });
            csv += line.join(',') + '\n';
        });
        var blob = new Blob([csv], { type: 'text/csv' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'audit-logs-' + new Date().toISOString().slice(0,10) + '.csv';
        a.click();
    }
</script>

</body>
</html>
